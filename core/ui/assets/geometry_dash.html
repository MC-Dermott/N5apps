  Object.keys(IMAGE_CAMEOS).forEach(function(key) {
    const cfg = IMAGE_CAMEOS[key];
    const img = new Image();
    cfg.img = img;
    cfg.ready = false;
    img.onload = function() { cfg.ready = true; };
    img.onerror = function() { cfg.ready = false; };
    img.src = 'data:image/png;base64,' + cfg.b64;
  });
  CAMEO_TYPES = Object.keys(IMAGE_CAMEOS);


  function renderMenu() {
    levelGridEl.innerHTML = '';
    LEVELS.forEach(function(lv, idx) {
      const bestPct = getBestProgress(lv.id);
      const bestTime = getBestTime(lv.id);
      const card = document.createElement('div');
      card.className = 'level-card';
      const stars = '&#9733;'.repeat(lv.stars) + '<span style="color:#444">' + '&#9733;'.repeat(5 - lv.stars) + '</span>';
      let statLine = bestPct >= 100 ? 'Completed' : ('Best: ' + bestPct + '% reached');
      if (bestTime != null) statLine += ' &middot; ' + bestTime.toFixed(1) + 's';
      card.innerHTML =
        '<div class="stripe" style="background:' + lv.color + '"></div>' +
        '<div class="name">' + lv.name + '</div>' +
        '<div class="stars">' + stars + '</div>' +
        '<div class="stat">' + statLine + '</div>' +
        (bestPct >= 100 ? '<div class="complete-badge">CLEARED</div>' : '');
      card.addEventListener('click', function() { startLevel(idx); });
      levelGridEl.appendChild(card);
    });
  }

  function showMenu() {
    stopMusic();
    state = 'menu';
    menuEl.style.display = 'block';
    menuBtn.style.display = 'none';
    progressBar.style.display = 'none';
    msgEl.style.display = 'none';
    hudScore.parentElement.style.visibility = 'hidden';
    bestEl.style.visibility = 'hidden';
    renderMenu();
  }

  function startLevel(idx) {
    stopMusic();
    ensureAudio();
    currentLevelIndex = idx;
    level = LEVELS[idx];
    levelData = generateLevel(level);

    player = { x: 90, y: GROUND_Y - PLAYER_SIZE, vy: 0, size: PLAYER_SIZE, onGround: true, flying: false, gravityFlipped: false };
    particles = [];
    cameos = [];
    cameoAnchorWorldX = null;
    cameoNextIndex = 0;
    speed = level.baseSpeed;
    distanceTraveled = 0;
    frame = 0;
    rotation = 0;
    state = 'ready';

    menuEl.style.display = 'none';
    menuBtn.style.display = 'block';
    progressBar.style.display = 'block';
    progressFill.style.width = '0%';
    hudScore.parentElement.style.visibility = 'visible';
    bestEl.style.visibility = 'visible';
    hudLevel.textContent = level.name;
    hudScore.textContent = '0';
    updateBestLabel();

    msgEl.style.display = 'block';
    msgEl.innerHTML =
      '<div class="title" style="color:' + level.color + '">' + level.name + '</div>' +
      '<div class="sub">Tap / Click / Space to start</div>';
  }

  function retryLevel() { startLevel(currentLevelIndex); }

  function updateBestLabel() {
    const bestPct = getBestProgress(level.id);
    const bestTime = getBestTime(level.id);
    let txt = 'Best: ' + bestPct + '%';
    if (bestTime != null) txt += ' (' + bestTime.toFixed(1) + 's)';
    bestEl.textContent = txt;
  }

  function jump() {
    if (state === 'menu') return;
    ensureAudio();
    if (state === 'dead' || state === 'complete') { retryLevel(); return; }
    if (state === 'ready') {
      state = 'playing';
      msgEl.style.display = 'none';
      startMusic();
    }
    if (state === 'playing' && player.onGround) {
      const flipped = !player.flying && isInGravityZone(distanceTraveled + player.x);
      player.vy = flipped ? -JUMP_VELOCITY : JUMP_VELOCITY;
      player.onGround = false;
      playJumpSound();
    }
  }

  function rectsOverlap(ax, ay, aw, ah, bx, by, bw, bh) {
    return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
  }

  function die() {
    state = 'dead';
    stopMusic();
    playHitSound();
    const pct = Math.min(100, Math.floor((distanceTraveled / levelData.totalDistance) * 100));
    if (pct > getBestProgress(level.id)) setBestProgress(level.id, pct);
    updateBestLabel();

    for (let i = 0; i < 18; i++) {
      particles.push({
        x: player.x + player.size / 2,
        y: player.y + player.size / 2,
        vx: (Math.random() - 0.5) * 8,
        vy: (Math.random() - 0.5) * 8,
        life: 30 + Math.random() * 15
      });
    }

    msgEl.style.display = 'block';
    msgEl.innerHTML =
      '<div class="title lose">Game Over &mdash; ' + pct + '%</div>' +
      '<div class="sub">' + level.name + '</div>' +
      '<div class="btnRow">' +
      '<button class="primary" id="btnRetry">Retry</button>' +
      '<button class="secondary" id="btnMenu">Menu</button>' +
      '</div>' +
      '<div class="hint">Tap / click / space also retries</div>';
    document.getElementById('btnRetry').addEventListener('click', retryLevel);
    document.getElementById('btnMenu').addEventListener('click', showMenu);
  }

  function completeLevel() {
    state = 'complete';
    stopMusic();
    playCompleteSound();
    const seconds = frame / 60;
    const prevBest = getBestTime(level.id);
    const isNewBest = prevBest == null || seconds < prevBest;
    if (isNewBest) setBestTime(level.id, seconds);
    setBestProgress(level.id, 100);
    updateBestLabel();

    const hasNext = currentLevelIndex < LEVELS.length - 1;
    msgEl.style.display = 'block';
    msgEl.innerHTML =
      '<div class="title win">Level Complete!</div>' +
      '<div class="sub">' + level.name + ' &mdash; ' + seconds.toFixed(1) + 's' + (isNewBest ? ' (New Best!)' : '') + '</div>' +
      '<div class="btnRow">' +
      (hasNext ? '<button class="primary" id="btnNext">Next Level</button>' : '') +
      '<button class="secondary" id="btnRetry">Retry</button>' +
      '<button class="secondary" id="btnMenu">Menu</button>' +
      '</div>';
    if (hasNext) {
      document.getElementById('btnNext').addEventListener('click', function() { startLevel(currentLevelIndex + 1); });
    }
    document.getElementById('btnRetry').addEventListener('click', retryLevel);
    document.getElementById('btnMenu').addEventListener('click', showMenu);
  }

  function isInFlyZone(worldX) {
    if (!levelData.flyZones) return false;
    for (const z of levelData.flyZones) {
      if (worldX >= z.start && worldX < z.end) return true;
    }
    return false;
  }

  function isInPlatformZone(worldX) {
    if (!levelData.platformZones) return false;
    for (const z of levelData.platformZones) {
      if (worldX >= z.start && worldX < z.end) return true;
    }
    return false;
  }

  function isInGravityZone(worldX) {
    if (!levelData || !levelData.gravityZones) return false;
    for (const z of levelData.gravityZones) {
      if (worldX >= z.start && worldX < z.end) return true;
    }
    return false;
  }

  function update() {
    frame++;
    if (state !== 'playing') return;

    if (speed < level.maxSpeed) speed += SPEED_RAMP;

    distanceTraveled += speed;

    const wasFlying = player.flying;
    player.flying = isInFlyZone(distanceTraveled + player.x);

    if (player.flying) {
      // "Ship mode": hold to thrust upward, gravity pulls down constantly,
      // free vertical movement rather than a single jump arc.
      if (!wasFlying) player.vy = 0; // smooth hand-off when entering the zone
      player.vy += FLY_GRAVITY;
      if (isHolding) player.vy += FLY_THRUST;
      if (player.vy > FLY_MAX_VY) player.vy = FLY_MAX_VY;
      if (player.vy < -FLY_MAX_VY) player.vy = -FLY_MAX_VY;
      player.y += player.vy;
      const topLimit = FLY_TOP_MARGIN - 4;
      const bottomLimit = GROUND_Y - player.size;
      if (player.y < topLimit) { player.y = topLimit; player.vy = 0; }
      if (player.y > bottomLimit) { player.y = bottomLimit; player.vy = 0; }
      player.onGround = false;
      rotation = Math.max(-22, Math.min(22, player.vy * 3.2));
    } else {
      const flipped = isInGravityZone(distanceTraveled + player.x);
      player.gravityFlipped = flipped;
      player.vy += flipped ? -GRAVITY : GRAVITY;
      player.y += player.vy;
      const inPlatZone = !flipped && isInPlatformZone(distanceTraveled + player.x);
      if (flipped) {
        // Gravity portal section: the "ground" is the ceiling line instead -
        // gravity pulls up onto it, jump pushes back down away from it.
        if (player.y <= CEIL_Y) {
          player.y = CEIL_Y;
          player.vy = 0;
          player.onGround = true;
        } else {
          player.onGround = false;
        }
      } else if (inPlatZone) {
        // Suspended-block section: platforms can sit at different heights
        // (staircases), so landing is a proper "did my feet cross this
        // specific platform's surface this frame, while falling, while
        // over its width" check - not just "am I below some fixed line".
        // Missing every platform means falling clean through into the pit.
        if (player.vy >= 0) {
          const feetNew = player.y + player.size;
          const feetOld = feetNew - player.vy;
          let landed = false;
          for (const p of (levelData.platforms || [])) {
            const screenX = p.worldX - distanceTraveled;
            if (player.x + player.size <= screenX || player.x >= screenX + p.w) continue;
            if (feetOld <= p.y && feetNew >= p.y) {
              player.y = p.y - player.size;
              player.vy = 0;
              player.onGround = true;
              landed = true;
              break;
            }
          }
          if (!landed) player.onGround = false;
        } else {
          player.onGround = false;
        }
      } else if (player.y + player.size >= GROUND_Y) {
        player.y = GROUND_Y - player.size;
        player.vy = 0;
        player.onGround = true;
      } else {
        player.onGround = false;
      }

      // Safety net: if nothing above caught the player and they've fallen
      // well past the ground line, they've missed every platform in a pit
      // section (or fallen through some other gap) - that's a fall to
      // death regardless of which zone they're nominally still "in".
      if (!flipped && !player.onGround && player.y > GROUND_Y + 60) {
        die();
        return;
      }

      if (player.onGround) {
        rotation = Math.round(rotation / 90) * 90;
      } else {
        rotation += flipped ? -6.5 : 6.5;
      }
    }

    // Speed portals: hard-set the scroll speed on touch; the normal ramp
    // toward level.maxSpeed continues climbing from whatever the portal set.
    for (const p of (levelData.portals || [])) {
      if (!p.triggered && distanceTraveled + player.x >= p.worldX) {
        p.triggered = true;
        speed = level.baseSpeed * p.mult;
      }
    }

    hudScore.textContent = String(Math.floor(distanceTraveled / 12));
    progressFill.style.width = Math.min(100, (distanceTraveled / levelData.totalDistance) * 100) + '%';

    if (distanceTraveled + player.x >= levelData.totalDistance) {
      completeLevel();
      return;
    }

    for (const o of levelData.obstacles) {
      const screenX = o.worldX - distanceTraveled;
      if (screenX < -50 || screenX > W + 50) continue;
      const oy = o.ceilingMounted ? CEIL_Y : GROUND_Y - o.h;
      const pad = o.type === 'spike' ? 8 : 3;
      if (rectsOverlap(
        player.x + pad, player.y + pad, player.size - pad * 2, player.size - pad * 2,
        screenX + pad, oy + pad, o.w - pad * 2, o.h - pad * 2
      )) {
        die();
        return;
      }
    }

    for (const o of (levelData.ceilingObstacles || [])) {
      const screenX = o.worldX - distanceTraveled;
      if (screenX < -50 || screenX > W + 50) continue;
      const pad = 6;
      if (rectsOverlap(
        player.x + pad, player.y + pad, player.size - pad * 2, player.size - pad * 2,
        screenX + pad, pad, o.w - pad * 2, o.h - pad * 2
      )) {
        die();
        return;
      }
    }
  }

  function updateParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.25;
      p.life--;
      if (p.life <= 0) particles.splice(i, 1);
    }
  }

  // One particular hill that cameos pop up from and sink back behind. It's
  // anchored to a world position (picked once, the first time it's needed)
  // rather than a screen position, and its on-screen x is recomputed every
  // frame using the SAME parallax factor as the hill layer - so it scrolls
  // in lockstep with the hills and stays visually stuck to that one bump
  // instead of drifting relative to it.
  const CAMEO_SCREEN_X = W * 0.42; // where that hill sits on screen when first anchored
  const CAMEO_RISE_FRAMES = 55;
  const CAMEO_HOLD_FRAMES = 110;
  const CAMEO_FALL_FRAMES = 55;
  const CAMEO_SCALE = 0.62; // shrink the pop-up images down from their base dispW
  // Exactly three pop-ups over a full run, spaced out by level progress
  // (not by a random timer, which could dry-spell a slow/careful run down
  // to just one) - at roughly 15%, 45% and 75% of the way through.
  const CAMEO_DISTANCE_FRACTIONS = [0.15, 0.45, 0.75];
  let cameoNextIndex = 0;

  function easeInOutSine(t) { return -(Math.cos(Math.PI * t) - 1) / 2; }

  function spawnCameo() {
    if (cameos.length) return; // only one pop-up spot, one at a time
    if (cameoAnchorWorldX === null) {
      cameoAnchorWorldX = (distanceTraveled || 0) * HILL_PARALLAX + CAMEO_SCREEN_X;
    }
    const type = CAMEO_TYPES[Math.floor(Math.random() * CAMEO_TYPES.length)];
    cameos.push({ type: type, phase: 'rise', t: 0 });
  }

  function updateCameos() {
    if (state === 'playing' && levelData && cameoNextIndex < CAMEO_DISTANCE_FRACTIONS.length) {
      const threshold = levelData.totalDistance * CAMEO_DISTANCE_FRACTIONS[cameoNextIndex];
      if ((distanceTraveled || 0) >= threshold) {
        spawnCameo();
        cameoNextIndex++;
      }
    }
    for (let i = cameos.length - 1; i >= 0; i--) {
      const c = cameos[i];
      c.t++;
      if (c.phase === 'rise' && c.t >= CAMEO_RISE_FRAMES) { c.phase = 'hold'; c.t = 0; }
      else if (c.phase === 'hold' && c.t >= CAMEO_HOLD_FRAMES) { c.phase = 'fall'; c.t = 0; }
      else if (c.phase === 'fall' && c.t >= CAMEO_FALL_FRAMES) { cameos.splice(i, 1); }
    }
  }

  function drawImageCameo(c) {
    const cfg = IMAGE_CAMEOS[c.type];
    if (!cfg) return;
    const screenX = (cameoAnchorWorldX === null ? CAMEO_SCREEN_X : cameoAnchorWorldX) - (distanceTraveled || 0) * HILL_PARALLAX;
    const dispW = cfg.dispW * CAMEO_SCALE;
    const dispH = cfg.ready ? dispW * (cfg.img.naturalHeight / cfg.img.naturalWidth) : dispW * 0.9;
    // Buried (hidden behind the hill) and fully-risen bottom-edge heights,
    // both kept well under HILL_BASE_HEIGHT (the shortest hill anywhere in
    // the range) so the image never fully clears even the smallest bump -
    // it stays looking like it's popping up from behind it, not standing
    // out in the open. 'ground' cameos (vehicles, figures) rise less than
    // 'up' cameos (banners, jerseys, wide shots).
    const buriedBottom = GROUND_Y - 10;
    const peakBottom = cfg.anchor === 'ground'
      ? GROUND_Y - HILL_BASE_HEIGHT * 0.48
      : GROUND_Y - HILL_BASE_HEIGHT * 0.68;

    let frac;
    if (c.phase === 'rise') frac = easeInOutSine(Math.min(1, c.t / CAMEO_RISE_FRAMES));
    else if (c.phase === 'hold') frac = 1;
    else frac = 1 - easeInOutSine(Math.min(1, c.t / CAMEO_FALL_FRAMES));

    const bottomY = buriedBottom + (peakBottom - buriedBottom) * frac;
    const y = bottomY - dispH;

    ctx.save();
    ctx.globalAlpha = 0.9;
    if (cfg.ready) {
      ctx.drawImage(cfg.img, screenX - dispW / 2, y, dispW, dispH);
    } else {
      ctx.fillStyle = '#c8102e';
      ctx.fillRect(screenX - dispW / 2, y, dispW, dispH);
    }
    ctx.restore();
  }

  function drawCameos() {
    for (const c of cameos) {
      drawImageCameo(c);
    }
  }

  function getSunPos() {
    // A larger version of the player's face, drifting across the sky like a
    // sun/moon - now a full rise -> set -> (dip below the horizon) -> rise
    // cycle rather than just bouncing off the horizon, so the sky can react
    // to whether it's currently above or below ground level.
    const f = frame || 0;
    const phase = (f % SUN_CYCLE_FRAMES) / SUN_CYCLE_FRAMES; // 0..1
    const arc = Math.sin(phase * Math.PI * 2); // 1 (noon) -> 0 (horizon) -> -1 (midnight) -> 0 (horizon)
    const margin = 70;
    const sunX = margin + phase * (W - margin * 2);
    const topY = 46;
    const horizonY = GROUND_Y - 16;
    const sunY = horizonY - arc * (horizonY - topY);
    // The moon traces its own mirror-image rise/peak/set arc during the
    // night half of the cycle (arc < 0), reaching the same horizon line and
    // peak height the sun does during the day - just offset by half a cycle.
    const moonArc = Math.max(0, -arc);
    const moonY = horizonY - moonArc * (horizonY - topY);
    return { sunX: sunX, sunY: sunY, arc: arc, moonArc: moonArc, moonY: moonY, horizonY: horizonY };
  }

  function drawSun() {
    const sun = getSunPos();
    if (sun.arc <= 0) return; // night half - the sun is below the horizon
    if (sun.sunY - SUN_SIZE / 2 > H || sun.sunY + SUN_SIZE / 2 < 0) return;

    ctx.save();
    ctx.globalAlpha = Math.max(0.12, Math.min(1, 0.4 + sun.arc * 0.5));
    ctx.shadowColor = '#ffd27a';
    ctx.shadowBlur = 35;
    if (playerImgReady) {
      ctx.drawImage(playerImg, sun.sunX - SUN_SIZE / 2, sun.sunY - SUN_SIZE / 2, SUN_SIZE, SUN_SIZE);
    } else {
      ctx.fillStyle = '#ffd27a';
      ctx.beginPath();
      ctx.arc(sun.sunX, sun.sunY, SUN_SIZE / 2, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawMoon() {
    const sun = getSunPos();
    if (sun.moonArc <= 0) return; // day half - the moon is below the horizon
    if (sun.moonY - SUN_SIZE / 2 > H || sun.moonY + SUN_SIZE / 2 < 0) return;

    ctx.save();
    ctx.globalAlpha = Math.max(0.25, Math.min(1, 0.5 + sun.moonArc * 0.5));
    ctx.shadowColor = '#bcd2ff';
    ctx.shadowBlur = 30;
    const img = moonImgReady ? moonImg : (playerImgReady ? playerImg : null);
    if (img) {
      ctx.drawImage(img, sun.sunX - SUN_SIZE / 2, sun.moonY - SUN_SIZE / 2, SUN_SIZE, SUN_SIZE);
    } else {
      ctx.fillStyle = '#dbe6ff';
      ctx.beginPath();
      ctx.arc(sun.sunX, sun.moonY, SUN_SIZE / 2, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  // Fixed starfield, deterministically hashed (same trick as the clouds and
  // hills) so it never needs per-frame randomness. Scrolls very slowly for a
  // touch of parallax depth, and fades in/out with the day/night blend.
  const STAR_COUNT = 60;
  const STAR_FIELD_PERIOD = 900;
  const stars = [];
  for (let i = 0; i < STAR_COUNT; i++) {
    const h1 = Math.sin(i * 12.9898) * 43758.5453; const rx = h1 - Math.floor(h1);
    const h2 = Math.sin(i * 78.233) * 12543.123; const ry = h2 - Math.floor(h2);
    const h3 = Math.sin(i * 37.719) * 5871.51; const rs = h3 - Math.floor(h3);
    stars.push({ wx: rx * STAR_FIELD_PERIOD, y: 8 + ry * (GROUND_Y - 70), r: 0.6 + rs * 1.3, phase: rx * Math.PI * 2 });
  }

  function drawStars(alpha) {
    if (alpha <= 0.01) return;
    const dist = (distanceTraveled || 0) * 0.08;
    const f = frame || 0;
    ctx.save();
    for (const s of stars) {
      const shift = Math.floor((dist - s.wx) / STAR_FIELD_PERIOD) * STAR_FIELD_PERIOD;
      for (let rep = 0; rep < 2; rep++) {
        const screenX = s.wx + shift + rep * STAR_FIELD_PERIOD - dist;
        if (screenX < -6 || screenX > W + 6) continue;
        const twinkle = 0.5 + 0.5 * Math.sin(f * 0.05 + s.phase);
        ctx.globalAlpha = alpha * (0.4 + twinkle * 0.6);
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(screenX, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.restore();
  }

  const AURORA_BANDS = [
    { color: [80, 230, 150], baseY: 68, amp: 22, freq: 0.018, speed: 0.006, thickness: 26 },
    { color: [90, 180, 230], baseY: 98, amp: 18, freq: 0.014, speed: -0.004, thickness: 20 },
    { color: [170, 120, 220], baseY: 52, amp: 16, freq: 0.022, speed: 0.008, thickness: 18 }
  ];

  function drawAurora(nightT) {
    // Wavy, shimmering ribbons of light high in the sky, only once the sky
    // has settled into full night (a bit of a lag past the horizon
    // crossing, since aurora reads better against a genuinely dark sky
    // rather than dusk). Drawn in screen space - it's a sky phenomenon, not
    // tied to the scrolling terrain - and animated purely from frame count.
    const strength = Math.max(0, Math.min(1, (nightT - 0.5) * 2));
    if (strength <= 0.02) return;
    const f = frame || 0;
    ctx.save();
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    for (const b of AURORA_BANDS) {
      ctx.beginPath();
      for (let x = 0; x <= W; x += 8) {
        const y = b.baseY + Math.sin(x * b.freq + f * b.speed) * b.amp +
          Math.sin(x * b.freq * 2.3 + f * b.speed * 1.7) * b.amp * 0.35;
        if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.strokeStyle = 'rgba(' + b.color.join(',') + ',' + (0.26 * strength) + ')';
      ctx.lineWidth = b.thickness;
      ctx.shadowColor = 'rgba(' + b.color.join(',') + ',0.5)';
      ctx.shadowBlur = 20;
      ctx.stroke();
    }
    ctx.restore();
  }

  function hillLayer(parallax, baseHeight, heightVar, period, color, yBase) {
    // One rolling-hill silhouette layer: smooth rounded bumps built from a
    // pair of quadratic curves per bump (up to the peak, back down), tiled
    // periodically and scrolled at a fraction of the foreground speed
    // (parallax) so multiple layers read as depth rather than a flat wall.
    // Peak heights are hashed from world position - same trick used for the
    // overhead clouds - so the skyline has variety with no per-frame state.
    const dist = (distanceTraveled || 0) * parallax;
    const first = Math.floor((dist - W) / period) * period;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(-10, yBase);
    for (let wx = first; wx < dist + W + period; wx += period) {
      const screenX = wx - dist;
      const h = Math.sin(wx * 0.0021) * 43758.5453;
      const bump = h - Math.floor(h);
      const peakY = yBase - (baseHeight + bump * heightVar);
      const midX = screenX + period / 2;
      ctx.quadraticCurveTo(screenX + period * 0.25, peakY, midX, peakY);
      ctx.quadraticCurveTo(screenX + period * 0.75, peakY, screenX + period, yBase);
    }
    ctx.lineTo(W + 10, yBase);
    ctx.closePath();
    ctx.fill();
  }

  const HILL_PARALLAX = 0.3, HILL_PERIOD = 360, HILL_BASE_HEIGHT = 150, HILL_HEIGHT_VAR = 60;

  function drawHills() {
    // A single range of large, rounded green hills along the horizon,
    // cresting to roughly half the canvas height.
    ctx.save();
    hillLayer(HILL_PARALLAX, HILL_BASE_HEIGHT, HILL_HEIGHT_VAR, HILL_PERIOD, '#4f8a3d', GROUND_Y - 1);
    ctx.restore();
  }

  function drawSmallSheep(x, y, scale, alpha) {
    if (alpha <= 0.03) return;
    const w = 11 * scale, h = 7 * scale;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = '#2b2b2b';
    ctx.lineWidth = Math.max(1, scale);
    for (let i = 0; i < 4; i++) {
      const lx = x - w / 2 + w * (0.15 + i * 0.23);
      ctx.beginPath();
      ctx.moveTo(lx, y + h * 0.4);
      ctx.lineTo(lx, y + h * 0.4 + 3 * scale);
      ctx.stroke();
    }
    ctx.fillStyle = '#f7f4ee';
    ctx.beginPath();
    ctx.ellipse(x, y, w / 2, h / 2, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#3a342c';
    ctx.beginPath();
    ctx.ellipse(x + w * 0.42, y - h * 0.15, w * 0.22, h * 0.32, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawHillSheep(alpha) {
    // Tiny grazing sheep scattered on the hillside, one cluster per hill
    // bump, hashed from world position (same trick as the hill silhouette
    // itself) and placed at an approximate height along that bump's curve
    // so they read as standing on the slope rather than floating.
    if (alpha <= 0.03) return;
    const yBase = GROUND_Y - 1;
    const dist = (distanceTraveled || 0) * HILL_PARALLAX;
    const first = Math.floor((dist - W) / HILL_PERIOD) * HILL_PERIOD;
    for (let wx = first; wx < dist + W + HILL_PERIOD; wx += HILL_PERIOD) {
      const h1 = Math.sin(wx * 0.0021) * 43758.5453;
      const bump = h1 - Math.floor(h1);
      const peakHeight = HILL_BASE_HEIGHT + bump * HILL_HEIGHT_VAR;
      const h2 = Math.sin(wx * 0.0057 + 1.7) * 19831.774;
      const countRoll = h2 - Math.floor(h2);
      const count = countRoll < 0.35 ? 0 : (countRoll < 0.75 ? 1 : 2);
      for (let i = 0; i < count; i++) {
        const h3 = Math.sin(wx * 0.0091 + i * 3.7) * 27431.23;
        const t = 0.15 + (h3 - Math.floor(h3)) * 0.7;
        const screenX = wx - dist + t * HILL_PERIOD;
        if (screenX < -20 || screenX > W + 20) continue;
        const localY = yBase - peakHeight * Math.sin(t * Math.PI) * 0.85 + 5;
        const h4 = Math.sin(wx * 0.013 + i * 9.1) * 8821.9;
        const scale = 0.8 + (h4 - Math.floor(h4)) * 0.6;
        drawSmallSheep(screenX, localY, scale, alpha);
      }
    }
  }

  function drawFootballPlayer(x, y, scale, alpha) {
    // Tiny side-on figure in a black-and-red halved kit, standing on the
    // slope - same silhouette scale as the sheep.
    if (alpha <= 0.03) return;
    ctx.save();
    ctx.globalAlpha = alpha;
    const torsoW = 5 * scale, torsoH = 6 * scale, headR = 2.1 * scale, legH = 5 * scale;
    ctx.strokeStyle = '#1c1c1c';
    ctx.lineWidth = Math.max(1, scale);
    ctx.beginPath();
    ctx.moveTo(x - 1.4 * scale, y);
    ctx.lineTo(x - 1.4 * scale, y + legH);
    ctx.moveTo(x + 1.4 * scale, y);
    ctx.lineTo(x + 1.4 * scale, y + legH);
    ctx.stroke();
    // halved jersey - red on the left, black on the right
    ctx.fillStyle = '#c8102e';
    ctx.fillRect(x - torsoW / 2, y - torsoH, torsoW / 2, torsoH);
    ctx.fillStyle = '#111';
    ctx.fillRect(x, y - torsoH, torsoW / 2, torsoH);
    // head
    ctx.fillStyle = '#e5b98c';
    ctx.beginPath();
    ctx.arc(x, y - torsoH - headR, headR, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawGoal(x, y, scale, alpha) {
    // A simple white goal frame with a light net crosshatch, sized to sit
    // just beside a player figure of the same scale.
    if (alpha <= 0.03) return;
    const w = 22 * scale, h = 13 * scale;
    const left = x - w / 2, right = x + w / 2, top = y - h;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = '#f5f5f5';
    ctx.lineWidth = Math.max(1, 1.4 * scale);
    ctx.beginPath();
    ctx.moveTo(left, y);
    ctx.lineTo(left, top);
    ctx.lineTo(right, top);
    ctx.lineTo(right, y);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
    ctx.lineWidth = 1;
    const cols = 4, rows = 3;
    for (let i = 1; i < cols; i++) {
      const gx = left + (w * i) / cols;
      ctx.beginPath();
      ctx.moveTo(gx, top);
      ctx.lineTo(gx, y);
      ctx.stroke();
    }
    for (let j = 1; j < rows; j++) {
      const gy = top + (h * j) / rows;
      ctx.beginPath();
      ctx.moveTo(left, gy);
      ctx.lineTo(right, gy);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawHillFootballPlayers(alpha) {
    // A handful of tiny players scattered more sparsely than the sheep,
    // hashed with different seeds so they land on different bumps/offsets.
    if (alpha <= 0.03) return;
    const yBase = GROUND_Y - 1;
    const dist = (distanceTraveled || 0) * HILL_PARALLAX;
    const first = Math.floor((dist - W) / HILL_PERIOD) * HILL_PERIOD;
    for (let wx = first; wx < dist + W + HILL_PERIOD; wx += HILL_PERIOD) {
      const h1 = Math.sin(wx * 0.0021) * 43758.5453;
      const bump = h1 - Math.floor(h1);
      const peakHeight = HILL_BASE_HEIGHT + bump * HILL_HEIGHT_VAR;
      const h2 = Math.sin(wx * 0.0083 + 4.4) * 15231.9;
      const roll = h2 - Math.floor(h2);
      if (roll > 0.5) continue; // only some bumps get a player
      const h3 = Math.sin(wx * 0.0104 + 2.1) * 9021.5;
      const t = 0.2 + (h3 - Math.floor(h3)) * 0.6;
      const screenX = wx - dist + t * HILL_PERIOD;
      if (screenX < -15 || screenX > W + 15) continue;
      const localY = yBase - peakHeight * Math.sin(t * Math.PI) * 0.85 + 5;
      const h4 = Math.sin(wx * 0.017 + 7.3) * 6821.2;
      const scale = 0.9 + (h4 - Math.floor(h4)) * 0.5;
      const h5 = Math.sin(wx * 0.029 + 5.6) * 4211.7;
      const side = (h5 - Math.floor(h5)) < 0.5 ? -1 : 1;
      drawGoal(screenX + side * 17 * scale, localY, scale, alpha);
      drawFootballPlayer(screenX, localY, scale, alpha);
    }
  }

  // A small building nestled on one particular hill (loosely modeled on a
  // coastal school - a long white block with a red entrance tower and a
  // patch of bright-green pitch beside it), at a fixed world position so it
  // scrolls by exactly once, in lockstep with the hill it sits on.
  const BUILDING_WORLD_X = 5000;

  function drawHillBuilding(alpha) {
    if (alpha <= 0.03) return;
    const dist = (distanceTraveled || 0) * HILL_PARALLAX;
    const screenX = BUILDING_WORLD_X - dist;
    if (screenX < -80 || screenX > W + 80) return;

    const yBase = GROUND_Y - 1;
    const tileStart = Math.floor(BUILDING_WORLD_X / HILL_PERIOD) * HILL_PERIOD;
    const t = (BUILDING_WORLD_X - tileStart) / HILL_PERIOD;
    const h1 = Math.sin(tileStart * 0.0021) * 43758.5453;
    const bump = h1 - Math.floor(h1);
    const peakHeight = HILL_BASE_HEIGHT + bump * HILL_HEIGHT_VAR;
    const baseY = yBase - peakHeight * Math.sin(t * Math.PI) * 0.85 + 5;

    const w = 62, mainH = 26, towerW = 14, towerH = 40;
    const left = screenX - w / 2;

    ctx.save();
    ctx.globalAlpha = alpha;

    // patch of bright pitch beside the building
    ctx.fillStyle = '#7bc94f';
    ctx.fillRect(left - 36, baseY - 7, 32, 8);
    ctx.strokeStyle = 'rgba(255,255,255,0.5)';
    ctx.lineWidth = 1;
    ctx.strokeRect(left - 36, baseY - 7, 32, 8);

    // main white block
    ctx.fillStyle = '#f2f2ef';
    ctx.fillRect(left, baseY - mainH, w, mainH);
    ctx.strokeStyle = 'rgba(90,90,90,0.4)';
    ctx.strokeRect(left, baseY - mainH, w, mainH);
    ctx.fillStyle = '#c9c9c4';
    ctx.fillRect(left - 1, baseY - mainH - 2, w + 2, 3);

    // windows along the white block
    ctx.fillStyle = '#3a4a5a';
    for (let i = 0; i < 5; i++) {
      const wx = left + 6 + (i * (w - 16)) / 4;
      ctx.fillRect(wx, baseY - mainH + 8, 5, 7);
    }

    // red entrance tower, taller than the main roofline
    const towerX = screenX - towerW / 2 - 6;
    ctx.fillStyle = '#c8102e';
    ctx.fillRect(towerX, baseY - towerH, towerW, towerH);
    ctx.strokeStyle = '#8a0a1c';
    ctx.strokeRect(towerX, baseY - towerH, towerW, towerH);
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.fillRect(towerX + 3, baseY - towerH + 6, 2, towerH - 12);
    ctx.fillRect(towerX + towerW - 5, baseY - towerH + 6, 2, towerH - 12);

    ctx.restore();
  }

  // A small standing-stone circle, loosely modeled on the Calanais Stones
  // on Lewis - a cluster of weathered grey slabs of varying height with a
  // taller one at the centre - at a fixed world position on one hill.
  const CALANAIS_WORLD_X = 2000;

  function hillCurveBaseY(worldX) {
    // Same approximation used for the hill sheep/building: which hill
    // "tile" a fixed world x falls into, and roughly how high the slope is
    // there, so decorations sit on the grass instead of floating.
    const yBase = GROUND_Y - 1;
    const tileStart = Math.floor(worldX / HILL_PERIOD) * HILL_PERIOD;
    const t = (worldX - tileStart) / HILL_PERIOD;
    const h1 = Math.sin(tileStart * 0.0021) * 43758.5453;
    const bump = h1 - Math.floor(h1);
    const peakHeight = HILL_BASE_HEIGHT + bump * HILL_HEIGHT_VAR;
    return yBase - peakHeight * Math.sin(t * Math.PI) * 0.85 + 5;
  }

  function drawCalanaisStones(alpha) {
    if (alpha <= 0.03) return;
    const dist = (distanceTraveled || 0) * HILL_PARALLAX;
    const screenX = CALANAIS_WORLD_X - dist;
    if (screenX < -60 || screenX > W + 60) return;
    const baseY = hillCurveBaseY(CALANAIS_WORLD_X);

    const stones = [
      { dx: -22, h: 14, w: 5 },
      { dx: -14, h: 20, w: 6 },
      { dx: -6, h: 26, w: 6 },
      { dx: 2, h: 33, w: 7 },
      { dx: 10, h: 24, w: 6 },
      { dx: 18, h: 18, w: 6 },
      { dx: 26, h: 13, w: 5 }
    ];
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = '#8a8a86';
    ctx.strokeStyle = '#5c5c58';
    ctx.lineWidth = 1;
    for (const s of stones) {
      const x = screenX + s.dx;
      const topY = baseY - s.h;
      ctx.beginPath();
      ctx.moveTo(x - s.w / 2, baseY);
      ctx.lineTo(x - s.w / 2, topY + 3);
      ctx.quadraticCurveTo(x - s.w / 2, topY, x, topY);
      ctx.quadraticCurveTo(x + s.w / 2, topY, x + s.w / 2, topY + 3);
      ctx.lineTo(x + s.w / 2, baseY);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    }
    ctx.restore();
  }

  // A small stone church with a tall battlemented tower, loosely modeled on
  // St Clement's Church in Rodel, Isle of Harris, at a fixed world position
  // on a later hill.
  const CHURCH_WORLD_X = 19800;

  function drawStClementsChurch(alpha) {
    if (alpha <= 0.03) return;
    const dist = (distanceTraveled || 0) * HILL_PARALLAX;
    const screenX = CHURCH_WORLD_X - dist;
    if (screenX < -70 || screenX > W + 70) return;
    const baseY = hillCurveBaseY(CHURCH_WORLD_X);

    const stone = '#9a9088';
    const dark = '#6b6259';
    ctx.save();
    ctx.globalAlpha = alpha;

    // nave, to the right of the tower
    const naveW = 34, naveH = 20;
    const naveX = screenX - 2;
    ctx.fillStyle = stone;
    ctx.fillRect(naveX, baseY - naveH, naveW, naveH);
    ctx.strokeStyle = dark;
    ctx.strokeRect(naveX, baseY - naveH, naveW, naveH);
    ctx.beginPath();
    ctx.moveTo(naveX - 2, baseY - naveH);
    ctx.lineTo(naveX + naveW / 2, baseY - naveH - 10);
    ctx.lineTo(naveX + naveW + 2, baseY - naveH);
    ctx.closePath();
    ctx.fillStyle = '#5c534b';
    ctx.fill();
    ctx.stroke();

    // square tower, taller, to the left
    const towerW = 20, towerH = 48;
    const towerX = screenX - towerW - 6;
    ctx.fillStyle = stone;
    ctx.fillRect(towerX, baseY - towerH, towerW, towerH);
    ctx.strokeStyle = dark;
    ctx.strokeRect(towerX, baseY - towerH, towerW, towerH);

    // crenellated (battlement) top
    const merlonW = 4, gapW = 3, n = 3;
    ctx.fillStyle = stone;
    let mx = towerX;
    for (let i = 0; i < n; i++) {
      ctx.fillRect(mx, baseY - towerH - 6, merlonW, 6);
      ctx.strokeRect(mx, baseY - towerH - 6, merlonW, 6);
      mx += merlonW + gapW;
    }

    // small dark window slit on the tower
    ctx.fillStyle = '#2b2620';
    ctx.fillRect(towerX + towerW / 2 - 1.5, baseY - towerH + 14, 3, 9);

    ctx.restore();
  }

  function drawBackground() {
    ctx.clearRect(0, 0, W, H);

    // 0 = face above the horizon (day, sky blue) -> 1 = face below the
    // horizon (night, black with stars). A narrow band around the horizon
    // crossing (arc==0) blends smoothly instead of cutting instantly.
    const sun = getSunPos();
    const nightT = Math.max(0, Math.min(1, (0.15 - sun.arc) / 0.3));

    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, lerpColor(SKY_DAY_TOP, SKY_NIGHT_TOP, nightT));
    grad.addColorStop(1, lerpColor(SKY_DAY_BOTTOM, SKY_NIGHT_BOTTOM, nightT));
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    drawStars(nightT);
    drawAurora(nightT);
    drawSun();
    drawMoon();
    drawOverheadClouds();

    ctx.strokeStyle = 'rgba(255,255,255,0.05)';
    ctx.lineWidth = 1;
    const gridOffset = Math.floor(distanceTraveled || 0) % 40;
    for (let x = -gridOffset; x < W; x += 40) {
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, GROUND_Y);
      ctx.stroke();
    }

    drawCameos();
    drawHills();
    drawHillSheep(1 - nightT);
    drawHillFootballPlayers(1 - nightT);
    drawHillBuilding(1 - nightT);
    drawCalanaisStones(1 - nightT);
    drawStClementsChurch(1 - nightT);

    ctx.fillStyle = '#22223f';
    ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);
    ctx.strokeStyle = '#5ad1ff';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(0, GROUND_Y);
    ctx.lineTo(W, GROUND_Y);
    ctx.stroke();

    ctx.strokeStyle = 'rgba(90,209,255,0.35)';
    ctx.lineWidth = 2;
    for (let x = -gridOffset; x < W; x += 40) {
      ctx.beginPath();
      ctx.moveTo(x, GROUND_Y + 6);
      ctx.lineTo(x + 14, GROUND_Y + 6);
      ctx.stroke();
    }

    drawGravityCeilingStrips();
    drawPitZones();
  }

  function drawGravityCeilingStrips() {
    // A mirrored "ground" strip at the top of the screen, shown only across
    // the x-range of an active gravity zone, so there's something for the
    // flipped player to visibly run along up there.
    if (!levelData || !levelData.gravityZones) return;
    const gridOffset = Math.floor(distanceTraveled || 0) % 40;
    for (const z of levelData.gravityZones) {
      const sx = z.start - distanceTraveled;
      const ex = z.end - distanceTraveled;
      if (ex < -20 || sx > W + 20) continue;
      const left = Math.max(-20, sx);
      const right = Math.min(W + 20, ex);
      if (right <= left) continue;

      ctx.save();
      ctx.beginPath();
      ctx.rect(left, 0, right - left, CEIL_Y + 6);
      ctx.clip();

      ctx.fillStyle = '#22223f';
      ctx.fillRect(left, 0, right - left, CEIL_Y);
      ctx.strokeStyle = '#ffd83d';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(left, CEIL_Y);
      ctx.lineTo(right, CEIL_Y);
      ctx.stroke();

      ctx.strokeStyle = 'rgba(255,216,61,0.4)';
      ctx.lineWidth = 2;
      for (let x = -gridOffset; x < W; x += 40) {
        ctx.beginPath();
        ctx.moveTo(x, CEIL_Y - 6);
        ctx.lineTo(x + 14, CEIL_Y - 6);
        ctx.stroke();
      }
      ctx.restore();
    }
  }

  function drawPitZones() {
    // Punches a bottomless-looking chasm through the continuous ground for
    // each active platform zone; the individual floating blocks (drawn later,
    // on top, in drawPlatforms) are the only solid ground inside that range.
    if (!levelData || !levelData.platformZones || !levelData.platformZones.length) return;
    const dist = distanceTraveled || 0;
    for (const z of levelData.platformZones) {
      const sx = z.start - dist;
      const ex = z.end - dist;
      if (ex < -20 || sx > W + 20) continue;
      const left = Math.max(-20, sx);
      const right = Math.min(W + 20, ex);
      if (right <= left) continue;
      const pitGrad = ctx.createLinearGradient(0, GROUND_Y - 4, 0, H);
      pitGrad.addColorStop(0, '#050510');
      pitGrad.addColorStop(1, '#000005');
      ctx.fillStyle = pitGrad;
      ctx.fillRect(left, GROUND_Y - 4, right - left, H - (GROUND_Y - 4));
    }
  }

  function drawCarSprite(d) {
    // Original vector art: a silver Skoda Octavia-style estate car, side profile.
    // Used as the player sprite while flying through the ceiling/ground gauntlets.
    const w = d * 1.7;
    const h = d * 0.66;
    ctx.beginPath();
    ctx.moveTo(-w / 2, h * 0.15);
    ctx.lineTo(-w / 2 + w * 0.08, -h * 0.05);
    ctx.lineTo(-w * 0.28, -h * 0.42);
    ctx.lineTo(w * 0.22, -h * 0.42);
    ctx.lineTo(w * 0.42, -h * 0.05);
    ctx.lineTo(w / 2, h * 0.15);
    ctx.lineTo(w / 2, h * 0.32);
    ctx.lineTo(-w / 2, h * 0.32);
    ctx.closePath();
    ctx.fillStyle = '#c9ccd1';
    ctx.fill();
    ctx.strokeStyle = '#8a8f99';
    ctx.lineWidth = 1;
    ctx.stroke();

    // windows
    ctx.fillStyle = '#2b3542';
    ctx.beginPath();
    ctx.moveTo(-w * 0.24, -h * 0.38);
    ctx.lineTo(-w * 0.08, -h * 0.38);
    ctx.lineTo(-w * 0.02, -h * 0.05);
    ctx.lineTo(-w * 0.3, -h * 0.05);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(w * 0.02, -h * 0.38);
    ctx.lineTo(w * 0.18, -h * 0.38);
    ctx.lineTo(w * 0.34, -h * 0.05);
    ctx.lineTo(w * 0.02, -h * 0.05);
    ctx.closePath();
    ctx.fill();

    // wheels
    ctx.fillStyle = '#1a1a1a';
    ctx.beginPath(); ctx.arc(-w * 0.28, h * 0.32, h * 0.22, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(w * 0.28, h * 0.32, h * 0.22, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#9aa0a8';
    ctx.beginPath(); ctx.arc(-w * 0.28, h * 0.32, h * 0.1, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(w * 0.28, h * 0.32, h * 0.1, 0, Math.PI * 2); ctx.fill();

    // lights
    ctx.fillStyle = '#fff3b0';
    ctx.fillRect(w * 0.46, -h * 0.02, w * 0.06, h * 0.12);
    ctx.fillStyle = '#e33';
    ctx.fillRect(-w * 0.52, -h * 0.02, w * 0.06, h * 0.12);
  }

  function drawPlayer() {
    if (state === 'menu') return;
    ctx.save();
    const cx = player.x + player.size / 2;
    const cy = player.y + player.size / 2;
    ctx.translate(cx, cy);
    ctx.rotate(rotation * Math.PI / 180);
    if (player.gravityFlipped && !player.flying) ctx.scale(1, -1);
    ctx.shadowColor = player.flying ? '#c9ccd1' : (player.gravityFlipped ? '#ffd83d' : '#00e5ff');
    ctx.shadowBlur = 14;
    const d = player.size * 1.15; // slightly larger than the hitbox, purely visual
    if (player.flying) {
      drawCarSprite(d);
    } else {
      let drew = false;
      if (playerImgReady) {
        try {
          ctx.drawImage(playerImg, -d / 2, -d / 2, d, d);
          drew = true;
        } catch (e) {
          drew = false;
        }
      }
      if (!drew) {
        ctx.fillStyle = '#00d9ff';
        ctx.beginPath();
        ctx.arc(0, 0, d / 2, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.shadowBlur = 0;
    ctx.restore();
  }

  function drawMushroom(screenX, oy, w, h, worldX) {
    // Fly-agaric / Mario-toadstool style obstacle: red spotted dome cap on a cream stem.
    const capH = h * 0.6;
    const stemH = h - capH;
    const cx = screenX + w / 2;
    const capBottomY = oy + capH;
    const capRX = w * 0.56;
    const capRY = capH;

    // stem
    const stemW = w * 0.42;
    ctx.fillStyle = '#fff2d9';
    ctx.fillRect(cx - stemW / 2, capBottomY, stemW, stemH);
    ctx.strokeStyle = '#d8c39a';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(cx - stemW / 2, capBottomY, stemW, stemH);

    // cap (dome)
    ctx.beginPath();
    ctx.ellipse(cx, capBottomY, capRX, capRY, 0, Math.PI, Math.PI * 2);
    ctx.closePath();
    ctx.fillStyle = '#e6392b';
    ctx.fill();
    ctx.strokeStyle = '#8f1f16';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // cap rim / skirt shadow where it meets the stem
    ctx.strokeStyle = 'rgba(0,0,0,0.2)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(cx - capRX * 0.85, capBottomY);
    ctx.lineTo(cx + capRX * 0.85, capBottomY);
    ctx.stroke();

    // deterministic white spots (seeded by worldX so they don't jitter frame to frame)
    const seed = Math.floor(worldX) % 997;
    const spots = [
      { dx: -0.42, dy: -0.55, r: 0.16 },
      { dx: 0.10, dy: -0.85, r: 0.19 },
      { dx: 0.44, dy: -0.42, r: 0.13 },
      { dx: -0.08, dy: -0.35, r: 0.11 }
    ];
    ctx.fillStyle = '#fff7ea';
    for (let i = 0; i < spots.length; i++) {
      const s = spots[i];
      const jitter = ((seed * (i + 3)) % 7) / 7 * 0.06 - 0.03;
      const sx = cx + (s.dx + jitter) * capRX * 1.6;
      const sy = capBottomY + s.dy * capRY;
      const r = s.r * capRX * 1.15;
      if (sy < capBottomY - 1) {
        ctx.beginPath();
        ctx.ellipse(sx, sy, r, r * 0.85, 0, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  function drawLighthouse(screenX, oy, w, h, worldX) {
    // Red-and-white striped lighthouse, styled after Eilean Glas on the Isle of Scalpay.
    const cx = screenX + w / 2;
    const roofH = h * 0.22;
    const lanternH = h * 0.16;
    const towerH = h - roofH - lanternH;
    const towerTopY = oy + roofH + lanternH;
    const towerBottomY = oy + h;
    const towerTopW = w * 0.5;
    const towerBottomW = w * 0.72;

    // tapered white tower shaft
    ctx.beginPath();
    ctx.moveTo(cx - towerTopW / 2, towerTopY);
    ctx.lineTo(cx + towerTopW / 2, towerTopY);
    ctx.lineTo(cx + towerBottomW / 2, towerBottomY);
    ctx.lineTo(cx - towerBottomW / 2, towerBottomY);
    ctx.closePath();
    ctx.fillStyle = '#f5f0e6';
    ctx.fill();
    ctx.strokeStyle = '#c9c0aa';
    ctx.lineWidth = 1;
    ctx.stroke();

    // two broad red bands, clipped to the tower's tapered silhouette
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(cx - towerTopW / 2, towerTopY);
    ctx.lineTo(cx + towerTopW / 2, towerTopY);
    ctx.lineTo(cx + towerBottomW / 2, towerBottomY);
    ctx.lineTo(cx - towerBottomW / 2, towerBottomY);
    ctx.closePath();
    ctx.clip();
    ctx.fillStyle = '#d6362a';
    const bandH = towerH * 0.17;
    ctx.fillRect(screenX - 4, towerTopY + towerH * 0.16, w + 8, bandH);
    ctx.fillRect(screenX - 4, towerTopY + towerH * 0.58, w + 8, bandH);
    ctx.restore();

    // gallery / balcony ring
    const galleryW = towerTopW + w * 0.18;
    ctx.fillStyle = '#3a3a3a';
    ctx.fillRect(cx - galleryW / 2, towerTopY - 3, galleryW, 5);

    // lantern room with a glowing beacon
    const lanternW = w * 0.36;
    const lanternTopY = oy + roofH;
    ctx.fillStyle = '#2b2b2b';
    ctx.fillRect(cx - lanternW / 2, lanternTopY, lanternW, lanternH);
    ctx.strokeStyle = '#111';
    ctx.lineWidth = 1;
    ctx.strokeRect(cx - lanternW / 2, lanternTopY, lanternW, lanternH);
    // Flashing beacon: a slow pulse with a brief bright flare, like a real
    // lighthouse's rotating lamp sweeping past. Each lighthouse's phase is
    // offset by its world position so a row of them doesn't blink in unison.
    const blinkPhase = ((frame || 0) * 0.045 + (worldX || 0) * 0.01) % (Math.PI * 2);
    const flare = Math.max(0, Math.sin(blinkPhase));
    const punch = Math.pow(flare, 4); // sharpens the pulse into a brief bright flash
    const glowAlpha = 0.35 + punch * 0.65;
    const glowBlur = 6 + punch * 18;
    const glowR = lanternH * (0.22 + punch * 0.14);

    ctx.save();
    if (punch > 0.15) {
      ctx.save();
      ctx.globalAlpha = punch * 0.5;
      ctx.fillStyle = '#ffe066';
      ctx.beginPath();
      ctx.arc(cx, lanternTopY + lanternH / 2, lanternH * 1.6, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
    ctx.globalAlpha = glowAlpha;
    ctx.shadowColor = '#ffe066';
    ctx.shadowBlur = glowBlur;
    ctx.fillStyle = '#ffe066';
    ctx.beginPath();
    ctx.arc(cx, lanternTopY + lanternH / 2, glowR, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // conical red roof
    ctx.beginPath();
    ctx.moveTo(cx - lanternW / 2 - 2, lanternTopY);
    ctx.lineTo(cx + lanternW / 2 + 2, lanternTopY);
    ctx.lineTo(cx, oy);
    ctx.closePath();
    ctx.fillStyle = '#b8291e';
    ctx.fill();
  }

  function drawTree(screenX, w, h) {
    // Hanging tree obstacle, growing down from the ceiling: trunk at the top
    // connecting to y=0, with a leafy canopy clump toward the bottom edge.
    const cx = screenX + w / 2;
    const canopyH = Math.min(h * 0.55, 46);
    const trunkH = Math.max(0, h - canopyH);
    const trunkW = w * 0.32;

    // trunk, from the ceiling down to the canopy
    ctx.fillStyle = '#6b4a2f';
    ctx.fillRect(cx - trunkW / 2, 0, trunkW, trunkH + 4);
    ctx.strokeStyle = '#4a2f1c';
    ctx.lineWidth = 1;
    ctx.strokeRect(cx - trunkW / 2, 0, trunkW, trunkH + 4);

    // canopy: a cluster of leafy blobs hanging at the bottom of the obstacle
    const canopyCy = trunkH + canopyH / 2;
    const canopyRX = w * 0.62;
    ctx.fillStyle = '#2f7d3a';
    ctx.beginPath(); ctx.ellipse(cx, canopyCy, canopyRX, canopyH / 2, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#3d9a49';
    ctx.beginPath(); ctx.ellipse(cx - canopyRX * 0.4, canopyCy - canopyH * 0.12, canopyRX * 0.55, canopyH * 0.4, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx + canopyRX * 0.42, canopyCy + canopyH * 0.08, canopyRX * 0.5, canopyH * 0.38, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#1f5a28';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.ellipse(cx, canopyCy, canopyRX, canopyH / 2, 0, 0, Math.PI * 2); ctx.stroke();
  }

  function drawMushroomBlock(screenX, w, baseY, worldX) {
    // A giant toadstool doubling as the "platform": same red-spotted dome
    // as the ground mushrooms, scaled up, with the rim (where cap meets
    // stem) sitting exactly on baseY - the same line used for collision -
    // so the player's feet land right at the base of the cap. The dome
    // bulges up above that line (out of the way) and the stem hangs down
    // into the pit below it, purely decorative.
    const capH = Math.max(22, w * 0.34);
    const capRX = w / 2;
    const capRY = capH;
    const cx = screenX + w / 2;
    const capBottomY = baseY;

    // stem, hanging down into the pit
    const stemW = w * 0.3;
    const stemH = 26;
    ctx.fillStyle = '#fff2d9';
    ctx.fillRect(cx - stemW / 2, capBottomY, stemW, stemH);
    ctx.strokeStyle = '#d8c39a';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(cx - stemW / 2, capBottomY, stemW, stemH);

    // cap dome, bulging upward, flat rim at baseY
    ctx.beginPath();
    ctx.ellipse(cx, capBottomY, capRX, capRY, 0, Math.PI, Math.PI * 2);
    ctx.closePath();
    ctx.fillStyle = '#e6392b';
    ctx.fill();
    ctx.strokeStyle = '#8f1f16';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // rim shadow where the cap meets the stem
    ctx.strokeStyle = 'rgba(0,0,0,0.2)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(cx - capRX * 0.92, capBottomY);
    ctx.lineTo(cx + capRX * 0.92, capBottomY);
    ctx.stroke();

    // deterministic white spots (seeded by worldX so they don't jitter
    // frame to frame), reusing the same technique as the ground mushrooms
    const seed = Math.floor(worldX) % 997;
    const spots = [
      { dx: -0.5, dy: -0.6, r: 0.13 },
      { dx: -0.1, dy: -0.85, r: 0.16 },
      { dx: 0.32, dy: -0.55, r: 0.12 },
      { dx: 0.55, dy: -0.3, r: 0.10 },
      { dx: -0.32, dy: -0.32, r: 0.10 },
      { dx: 0.08, dy: -0.45, r: 0.11 }
    ];
    ctx.fillStyle = '#fff7ea';
    for (let i = 0; i < spots.length; i++) {
      const s = spots[i];
      const jitter = ((seed * (i + 3)) % 7) / 7 * 0.05 - 0.025;
      const sx = cx + (s.dx + jitter) * capRX * 1.5;
      const sy = capBottomY + s.dy * capRY;
      const r = s.r * capRX * 1.1;
      if (sy < capBottomY - 1) {
        ctx.beginPath();
        ctx.ellipse(sx, sy, r, r * 0.85, 0, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  function drawPlatforms() {
    if (!levelData || !levelData.platforms) return;
    for (const p of levelData.platforms) {
      const screenX = p.worldX - distanceTraveled;
      if (screenX < -50 || screenX > W + 50) continue;
      drawMushroomBlock(screenX, p.w, p.y, p.worldX);
    }
  }

  function drawCloudPuff(cx, cy, scale) {
    const r = 16 * scale;
    ctx.beginPath();
    ctx.ellipse(cx, cy, r * 1.6, r, 0, 0, Math.PI * 2);
    ctx.ellipse(cx - r * 1.1, cy + r * 0.3, r * 0.9, r * 0.7, 0, 0, Math.PI * 2);
    ctx.ellipse(cx + r * 1.1, cy + r * 0.3, r * 0.9, r * 0.7, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawOverheadClouds() {
    // A higher, purely decorative band of drifting clouds during the
    // suspended-block section, so the player is visibly passing underneath
    // a whole cloud layer while hopping across the lower sheep-block
    // staircase. Deterministic from world position, so no jitter frame to frame.
    if (!levelData || !levelData.platformZones || !levelData.platformZones.length) return;
    const dist = distanceTraveled || 0;
    ctx.save();
    ctx.globalAlpha = 0.5;
    ctx.fillStyle = '#c9d6ea';
    for (const z of levelData.platformZones) {
      const zStart = z.start - 200;
      const zEnd = z.end + 200;
      const step = 180;
      const first = Math.ceil(zStart / step) * step;
      for (let wx = first; wx < zEnd; wx += step) {
        const screenX = wx - dist;
        if (screenX < -80 || screenX > W + 80) continue;
        const h = Math.sin(wx * 0.013) * 43758.5453;
        const bump = h - Math.floor(h);
        const cy = 55 + bump * 55;
        const scale = 0.7 + bump * 0.5;
        drawCloudPuff(screenX, cy, scale);
      }
    }
    ctx.restore();
  }

  function drawZoneTransitionMarkers(zones, color, tintAlpha) {
    // A glowing portal ring at the start and end of a special-mode zone,
    // with a faint tint across the whole stretch, so every switch between
    // running / flying / sheep-jumping / gravity-flip reads as a deliberate
    // transition rather than a hard cut.
    if (!zones || !zones.length) return;
    for (const z of zones) {
      const sx = z.start - distanceTraveled;
      const ex = z.end - distanceTraveled;
      if (ex > -30 && sx < W + 30) {
        const left = Math.max(-30, sx);
        const right = Math.min(W + 30, ex);
        if (right > left) {
          ctx.save();
          ctx.globalAlpha = tintAlpha;
          ctx.fillStyle = color;
          ctx.fillRect(left, CEIL_Y, right - left, GROUND_Y - CEIL_Y);
          ctx.restore();
        }
      }
      for (const worldX of [z.start, z.end]) {
        const px = worldX - distanceTraveled;
        if (px < -30 || px > W + 30) continue;
        ctx.save();
        ctx.strokeStyle = color;
        ctx.shadowColor = color;
        ctx.shadowBlur = 12;
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.ellipse(px, (CEIL_Y + GROUND_Y) / 2, 16, (GROUND_Y - CEIL_Y) / 2 - 4, 0, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }
    }
  }

  function drawGravityZoneMarkers() {
    drawZoneTransitionMarkers(levelData && levelData.gravityZones, '#ffd83d', 0.06);
  }

  function drawFlyZoneMarkers() {
    drawZoneTransitionMarkers(levelData && levelData.flyZones, '#c9ccd1', 0.05);
  }

  function drawPlatformZoneMarkers() {
    drawZoneTransitionMarkers(levelData && levelData.platformZones, '#8ecbff', 0.05);
  }

  function drawSpeedPortals() {
    // A small colored chevron marker: cyan = speed up, orange = slow down.
    if (!levelData || !levelData.portals) return;
    for (const p of levelData.portals) {
      const px = p.worldX - distanceTraveled;
      if (px < -30 || px > W + 30) continue;
      const fast = p.mult >= 1;
      const color = fast ? '#5ad1ff' : '#ffa94d';
      ctx.save();
      ctx.strokeStyle = color;
      ctx.shadowColor = color;
      ctx.shadowBlur = 10;
      ctx.lineWidth = 4;
      ctx.globalAlpha = 0.85;
      ctx.beginPath();
      ctx.moveTo(px, CEIL_Y - 6);
      ctx.lineTo(px, GROUND_Y + 6);
      ctx.stroke();
      ctx.fillStyle = color;
      const midY = (CEIL_Y + GROUND_Y) / 2;
      for (const dy of [-26, 0, 26]) {
        ctx.beginPath();
        if (fast) {
          ctx.moveTo(px - 9, midY + dy - 8);
          ctx.lineTo(px + 9, midY + dy);
          ctx.lineTo(px - 9, midY + dy + 8);
        } else {
          ctx.moveTo(px + 9, midY + dy - 8);
          ctx.lineTo(px - 9, midY + dy);
          ctx.lineTo(px + 9, midY + dy + 8);
        }
        ctx.closePath();
        ctx.fill();
      }
      ctx.restore();
    }
  }

  function drawObstacles() {
    if (state === 'menu' || !levelData) return;
    for (const o of levelData.obstacles) {
      const screenX = o.worldX - distanceTraveled;
      if (screenX < -50 || screenX > W + 50) continue;
      if (o.ceilingMounted) {
        // Same art, mirrored vertically in place so it reads as hanging down
        // from the flipped-gravity "ground" line at the ceiling.
        const oy = CEIL_Y;
        const midY = oy + o.h / 2;
        ctx.save();
        ctx.translate(0, midY);
        ctx.scale(1, -1);
        ctx.translate(0, -midY);
        if (o.type === 'spike') {
          drawLighthouse(screenX, oy, o.w, o.h, o.worldX);
        } else {
          drawMushroom(screenX, oy, o.w, o.h, o.worldX);
        }
        ctx.restore();
      } else {
        const oy = GROUND_Y - o.h;
        if (o.type === 'spike') {
          drawLighthouse(screenX, oy, o.w, o.h, o.worldX);
        } else {
          drawMushroom(screenX, oy, o.w, o.h, o.worldX);
        }
      }
    }
    for (const o of (levelData.ceilingObstacles || [])) {
      const screenX = o.worldX - distanceTraveled;
      if (screenX < -50 || screenX > W + 50) continue;
      drawTree(screenX, o.w, o.h);
    }
    drawPlatforms();
    drawGravityZoneMarkers();
    drawFlyZoneMarkers();
    drawPlatformZoneMarkers();
    drawSpeedPortals();
    // finish line
    const finishX = levelData.totalDistance - distanceTraveled;
    if (finishX > -20 && finishX < W + 20) {
      ctx.fillStyle = '#4ade80';
      ctx.fillRect(finishX, 0, 4, GROUND_Y);
      ctx.fillStyle = 'rgba(74,222,128,0.9)';
      ctx.font = 'bold 12px sans-serif';
      ctx.fillText('FINISH', finishX - 18, 18);
    }
  }

  function drawParticles() {
    for (const p of particles) {
      ctx.globalAlpha = Math.max(p.life / 45, 0);
      ctx.fillStyle = '#00d9ff';
      ctx.fillRect(p.x, p.y, 4, 4);
      ctx.globalAlpha = 1;
    }
  }

  function loop() {
    update();
    updateParticles();
    updateCameos();
    drawBackground();
    drawObstacles();
    drawPlayer();
    drawParticles();
    scheduleFrame(loop);
  }

  // requestAnimationFrame can silently stall on some pages/embeds (e.g. if the
  // document is briefly reported as not-visible), which would freeze the canvas
  // on a blank first frame forever. Watch for that and fall back to a plain
  // timer loop so the game always starts rendering.
  let rafStalled = false;
  function scheduleFrame(cb) {
    if (rafStalled) {
      setTimeout(cb, 16);
    } else {
      requestAnimationFrame(cb);
    }
  }
  let sawFirstRaf = false;
  requestAnimationFrame(function() { sawFirstRaf = true; });
  setTimeout(function() {
    if (!sawFirstRaf) rafStalled = true;
  }, 250);

  window.addEventListener('keydown', function(e) {
    if (e.code === 'Space' || e.code === 'ArrowUp') {
      e.preventDefault();
      isHolding = true;
      jump();
    } else if (e.code === 'Escape' && state !== 'menu') {
      showMenu();
    }
  });
  window.addEventListener('keyup', function(e) {
    if (e.code === 'Space' || e.code === 'ArrowUp') isHolding = false;
  });
  canvas.addEventListener('mousedown', function() { isHolding = true; jump(); });
  window.addEventListener('mouseup', function() { isHolding = false; });
  canvas.addEventListener('mouseleave', function() { isHolding = false; });
  canvas.addEventListener('touchstart', function(e) {
    e.preventDefault();
    isHolding = true;
    jump();
  }, { passive: false });
  canvas.addEventListener('touchend', function(e) {
    e.preventDefault();
    isHolding = false;
  }, { passive: false });
  canvas.addEventListener('touchcancel', function() { isHolding = false; });
  window.addEventListener('blur', function() { isHolding = false; });
  menuBtn.addEventListener('click', showMenu);
  muteBtn.addEventListener('click', toggleMute);

  showMenu();
  scheduleFrame(loop);
})();
</script>
</body>
</html>
