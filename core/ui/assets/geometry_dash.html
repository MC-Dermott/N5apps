<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Geometry Dash Clone</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #0d0d1a;
    overflow: hidden;
  }
  * { box-sizing: border-box; }
  #wrap {
    position: relative;
    width: 100%;
    max-width: 900px;
    margin: 0 auto;
    font-family: 'Segoe UI', Arial, sans-serif;
  }
  canvas {
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: 800 / 380;
    background: linear-gradient(#1a1a2e, #12121f);
    border-radius: 8px;
    touch-action: manipulation;
    cursor: pointer;
  }
  #hud {
    position: absolute;
    top: 10px;
    left: 14px;
    color: #eaeaea;
    font-size: 16px;
    font-weight: 600;
    text-shadow: 0 1px 3px rgba(0,0,0,0.6);
    pointer-events: none;
  }
  #hud .levelName {
    font-size: 12px;
    font-weight: 500;
    color: #9adfff;
    letter-spacing: 0.3px;
  }
  #best {
    position: absolute;
    top: 10px;
    right: 90px;
    color: #9adfff;
    font-size: 13px;
    font-weight: 600;
    text-align: right;
    text-shadow: 0 1px 3px rgba(0,0,0,0.6);
    pointer-events: none;
  }
  #menuBtn {
    position: absolute;
    top: 8px;
    right: 10px;
    background: rgba(20,20,40,0.65);
    color: #eee;
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    display: none;
  }
  #menuBtn:hover { background: rgba(40,40,70,0.85); }
  #muteBtn {
    position: absolute;
    top: 8px;
    right: 86px;
    background: rgba(20,20,40,0.65);
    color: #eee;
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 6px;
    padding: 6px 9px;
    font-size: 13px;
    line-height: 1;
    cursor: pointer;
  }
  #muteBtn:hover { background: rgba(40,40,70,0.85); }

  #msg {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: #ffffff;
    text-align: center;
    text-shadow: 0 2px 6px rgba(0,0,0,0.8);
    display: none;
  }
  #msg .title { font-size: 24px; font-weight: 800; }
  #msg .title.win { color: #4ade80; }
  #msg .title.lose { color: #ff5566; }
  #msg .sub { margin-top: 6px; font-size: 14px; color: #dddddd; }
  #msg .hint { margin-top: 4px; font-size: 12px; color: #9aa0c0; }
  #msg .btnRow { margin-top: 14px; display: flex; gap: 8px; justify-content: center; }
  #msg button {
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    padding: 8px 16px;
    border-radius: 6px;
    border: none;
    cursor: pointer;
  }
  #msg .primary { background: #00d9ff; color: #001018; }
  #msg .secondary { background: rgba(255,255,255,0.12); color: #fff; border: 1px solid rgba(255,255,255,0.3); }

  #progressBar {
    position: absolute;
    left: 14px;
    right: 14px;
    bottom: 10px;
    height: 5px;
    background: rgba(255,255,255,0.15);
    border-radius: 3px;
    overflow: hidden;
    display: none;
  }
  #progressFill {
    height: 100%;
    width: 0%;
    background: #00d9ff;
    transition: width 0.1s linear;
  }

  #menu {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 0%, #1e1e3f, #0b0b18);
    border-radius: 8px;
    padding: 22px 26px;
    overflow-y: auto;
  }
  #menu h2 {
    color: #fff;
    margin: 0 0 4px 0;
    font-size: 22px;
  }
  #menu .tagline {
    color: #9aa0c0;
    font-size: 13px;
    margin-bottom: 16px;
  }
  .level-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    gap: 12px;
  }
  .level-card {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 10px;
    padding: 14px;
    cursor: pointer;
    text-align: left;
    color: #fff;
    transition: transform 0.1s ease, border-color 0.1s ease;
  }
  .level-card:hover {
    transform: translateY(-2px);
    border-color: rgba(255,255,255,0.4);
  }
  .level-card .stripe {
    height: 5px;
    border-radius: 3px;
    margin-bottom: 10px;
  }
  .level-card .name {
    font-size: 15px;
    font-weight: 700;
    margin-bottom: 4px;
  }
  .level-card .stars {
    font-size: 12px;
    color: #ffd166;
    margin-bottom: 8px;
  }
  .level-card .stat {
    font-size: 11px;
    color: #9aa0c0;
  }
  .level-card .complete-badge {
    display: inline-block;
    margin-top: 6px;
    font-size: 10px;
    font-weight: 700;
    color: #4ade80;
    background: rgba(74,222,128,0.15);
    border: 1px solid rgba(74,222,128,0.4);
    padding: 2px 6px;
    border-radius: 4px;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="800" height="380"></canvas>
  <div id="hud"><div class="levelName" id="hudLevel"></div>Score: <span id="hudScore">0</span></div>
  <div id="best"></div>
  <button id="menuBtn">&#9776; Menu</button>
  <button id="muteBtn" title="Toggle sound">&#128266;</button>
  <div id="progressBar"><div id="progressFill"></div></div>
  <div id="msg"></div>

  <div id="menu">
    <h2>Select a Level</h2>
    <div class="tagline">Space / click / tap to jump. Difficulty increases with speed, spacing, and obstacle clusters.</div>
    <div class="level-grid" id="levelGrid"></div>
  </div>
</div>

      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function obstacleDims(type) {
    return type === 'spike' ? { w: 28, h: 28 } : { w: 30, h: 30 };
  }

  // Generates a fixed obstacle layout from a seed + difficulty knobs.
  // cfg.length is the approximate distance to generate obstacles across;
  // the actual finish line is placed FINISH_BUFFER after the last obstacle.
  //
  // cfg.flyZones (optional) marks distance ranges that are "flying" gauntlets:
  // a winding corridor with obstacles rising from the ground (mushroom/lighthouse)
  // and hanging from the ceiling (trees) on either side of a moving gap. Normal
  // ground-obstacle generation is skipped inside these ranges.
  //
  // cfg.platformZones (optional) marks distance ranges of Mario-style suspended
  // blocks: a run of same-height floating platforms with lethal pits between
  // them. Gap width (gapW, per-zone) and platform width (platW) are tuned so
  // a single fixed jump (JUMP_VELOCITY/GRAVITY, no variable jump height) can
  // clear the pit across the whole speed range the zone is reached at -
  // verified by frame-stepped simulation of the real physics loop, including
  // speed ramp. Normal ground-obstacle generation is skipped here too.
  //
  // cfg.gravityZones (optional) marks distance ranges where a gravity portal
  // has flipped the world: the "ground" relocates to the ceiling (CEIL_Y),
  // gravity pulls up instead of down, and jump pushes down instead of up.
  // Obstacles keep generating normally through these ranges (same cluster
  // logic, same mushroom/lighthouse art) but are tagged ceilingMounted so
  // they're positioned/measured from the ceiling and drawn mirrored.
  //
  // cfg.speedPortals (optional) auto-scatters point portals at a fixed
  // interval that set a hard speed multiplier on touch (the ramp toward
  // maxSpeed continues from whatever speed the portal set). Portals are
  // skipped inside fly/platform/gravity zones so they never interfere with
  // those zones' tuned timing.
  function generateLevel(cfg) {
    const rng = mulberry32(cfg.seed);
    const obstacles = [];
    const ceilingObstacles = [];
    const platforms = [];
    const portals = [];
    const flyZones = cfg.flyZones || [];
    const platformZones = cfg.platformZones || [];
    const gravityZones = cfg.gravityZones || [];

    function flyZoneAt(x) {
      for (const z of flyZones) {
        if (x >= z.start && x < z.end) return z;
      }
      return null;
    }

    // Lay out each platform zone's blocks first, since a zone's true end
    // (right at the edge of its last block) is derived, not fixed in cfg.
    //
    // Two shapes are supported:
    //  - zone.heights + zone.gaps: an explicit per-platform sequence, used
    //    for staircases. heights[i] is that platform's y-offset from
    //    GROUND_Y (negative = higher up); gaps[i] is the gap before
    //    platform i+1. A jump's arc crosses any given target height twice -
    //    once rising, once falling - and only the *falling* crossing is a
    //    valid landing (you can't land on a platform while still shooting
    //    up through it). For a climbing step that means the jump has to
    //    travel most of the way up and back down before it can land, which
    //    eats far more horizontal distance than it looks like at a glance -
    //    climbing steps need gaps of the same order as flat/descending ones,
    //    not near-zero. Every transition here (flat, climb, descend) was
    //    verified against the real jump arc using only falling-edge
    //    landings, then stress-tested with a reactive bot across a range of
    //    reaction times and speeds to confirm a comfortable margin.
    //  - zone.platW/gapW/count: a uniform flat run (all platforms at
    //    GROUND_Y), for simple hop-the-gap sections.
    for (const zone of platformZones) {
      const platW = zone.platW || 100;
      if (zone.heights && zone.gaps) {
        let x = zone.start;
        for (let i = 0; i < zone.heights.length; i++) {
          platforms.push({ worldX: x, w: platW, y: GROUND_Y + zone.heights[i] });
          if (i < zone.gaps.length) x += platW + zone.gaps[i];
        }
        zone.end = x + platW;
      } else {
        const gapW = zone.gapW || 150;
        const count = zone.count || 8;
        let x = zone.start;
        for (let i = 0; i < count; i++) {
          platforms.push({ worldX: x, w: platW, y: GROUND_Y });
          x += platW + gapW;
        }
        x -= gapW; // roll back the trailing gap - zone ends at the last block's edge
        zone.end = x;
      }
    }

    function platformZoneAt(x) {
      for (const z of platformZones) {
        if (x >= z.start && x < z.end) return z;
      }
      return null;
    }

    function gravityZoneAt(x) {
      for (const z of gravityZones) {
        if (x >= z.start && x < z.end) return z;
      }
      return null;
    }

    // Flipping (or unflipping) gravity instantly re-launches the player from
    // a standstill toward the opposite side of the track - roughly 250px,
    // which takes ~28 frames to cross under GRAVITY. During that whole
    // transit the player is airborne and can't jump, so obstacles can't
    // start appearing again until they've had time to land on the new side.
    const GRAVITY_TRANSIT_BUFFER = 260;
    // Exiting a flying zone hands control back to normal gravity from
    // wherever in the corridor the player happens to be (which can be near
    // the very top), so give the same kind of landing buffer as a gravity
    // flip rather than just the normal obstacle gap.
    const FLY_LANDING_BUFFER = 260;
    let wasInGravity = false;
    let cursor = RUNWAY;
    while (cursor < cfg.length) {
      const zone = flyZoneAt(cursor);
      if (zone) {
        cursor = zone.end + FLY_LANDING_BUFFER + cfg.minGap;
        wasInGravity = false;
        continue;
      }
      const pzone = platformZoneAt(cursor);
      if (pzone) {
        cursor = pzone.end + cfg.minGap;
        wasInGravity = false;
        continue;
      }
      const gzone = gravityZoneAt(cursor);
      const nowInGravity = !!gzone;
      if (nowInGravity !== wasInGravity) {
        cursor += GRAVITY_TRANSIT_BUFFER;
        wasInGravity = nowInGravity;
        continue;
      }
      let clusterSize = 1;
      if (rng() < cfg.clusterChance) {
        clusterSize = (cfg.maxCluster >= 3 && rng() < 0.35) ? 3 : 2;
      }
      const type = rng() < cfg.spikeRatio ? 'spike' : 'block';
      const dims = obstacleDims(type);
      const innerGap = 4;
      for (let i = 0; i < clusterSize; i++) {
        obstacles.push({ worldX: cursor, w: dims.w, h: dims.h, type: type, ceilingMounted: !!gzone });
        cursor += dims.w + innerGap;
      }
      cursor -= innerGap;
      cursor += cfg.minGap + rng() * (cfg.maxGap - cfg.minGap);
    }

    // Scatter speed portals at a fixed interval, skipping any spot that
    // falls inside a fly/platform/gravity zone.
    if (cfg.speedPortals) {
      const interval = cfg.speedPortals.interval || 900;
      const pattern = cfg.speedPortals.pattern || [1.3, 0.75, 1.0];
      let px = RUNWAY + interval;
      let pi = 0;
      while (px < cfg.length - 200) {
        if (!flyZoneAt(px) && !platformZoneAt(px) && !gravityZoneAt(px)) {
          portals.push({ worldX: px, mult: pattern[pi % pattern.length] });
          pi++;
        }
        px += interval;
      }
    }

    // Build the winding gap corridor for each flying zone.
    for (const zone of flyZones) {
      const spacing = zone.spacing || 160;
      const gapSize = zone.gapSize || 100;
      const freq = zone.freq || 0.9;
      const phase = zone.phase || 0;
      const corridorTop = FLY_TOP_MARGIN;
      const corridorMid = corridorTop + (GROUND_Y - corridorTop) / 2;
      const amp = Math.max(0, (GROUND_Y - corridorTop) / 2 - gapSize / 2 - 18);
      const entryBuffer = 260; // clear runway after the mode switch, before the first obstacle
      let x = zone.start + entryBuffer;
      let i = 0;
      while (x < zone.end) {
        const gapCenter = corridorMid + Math.sin(i * freq + phase) * amp;
        const gapTop = gapCenter + gapSize / 2;
        const gapBottom = gapCenter - gapSize / 2;
        const groundType = (i % 2 === 0) ? 'spike' : 'block'; // lighthouse / mushroom, alternating
        obstacles.push({ worldX: x, w: 32, h: Math.max(10, GROUND_Y - gapTop), type: groundType });
        ceilingObstacles.push({ worldX: x, w: 32, h: Math.max(14, gapBottom) }); // hangs from y=0 (the ceiling)
        x += spacing;
        i++;
      }
    }

    const lastFlyEnd = flyZones.length ? Math.max(...flyZones.map(z => z.end)) : 0;
    const lastPlatEnd = platformZones.length ? Math.max(...platformZones.map(z => z.end)) : 0;
    const lastGravEnd = gravityZones.length ? Math.max(...gravityZones.map(z => z.end)) : 0;
    const totalDistance = Math.max(cursor, lastFlyEnd, lastPlatEnd, lastGravEnd) + FINISH_BUFFER;
    return {
      obstacles: obstacles,
      ceilingObstacles: ceilingObstacles,
      platforms: platforms,
      portals: portals,
      flyZones: flyZones,
      platformZones: platformZones,
      gravityZones: gravityZones,
      totalDistance: totalDistance
    };
  }

  // A single continuous level that tours every mechanic in order, joined by
  // a normal ground-running stretch (and a portal-marker transition) between
  // each special section: run -> gravity flip -> run w/ speed portals ->
  // sheep-block staircase jumping -> run -> eased flying gauntlet -> run to finish.
  const LEVELS = [
    { id: 'full-run', name: 'The Full Run', stars: 5, color: '#38bdf8',
      // Ground stretches between each section are sized (along with the
      // zone positions below) so a clean, no-death run takes right around
      // 60 seconds - verified by simulating the actual speed/ramp/portal
      // timeline, not just guessed at.
      baseSpeed: 6.0, maxSpeed: 7.4, length: 22420,
      minGap: 240, maxGap: 360, clusterChance: 0.18, maxCluster: 2, spikeRatio: 0.5, seed: 7007,
      gravityZones: [{ start: 4425, end: 6125 }],
      // Sheep staircase: flat run-up -> climb 4 steps -> flat peak -> descend
      // 4 steps -> flat landing. Wide 160-wide blocks with a uniform 110 gap
      // give every transition (flat, climb, descend) a comfortable landing
      // window at every speed this level reaches - verified by simulating
      // the real jump arc (falling-edge landings only) and by a reactive
      // auto-jump bot swept across reaction times 0-70 frames and speeds
      // 6.0-7.4, which cleared the whole staircase in every case.
      platformZones: [{
        start: 9850, platW: 160,
        heights: [0, 0, 0, -30, -60, -90, -120, -120, -120, -90, -60, -30, 0, 0],
        gaps:    [110, 110, 110, 110, 110, 110, 110, 110, 110, 110, 110, 110, 110]
      }],
      // Eased well below the original flying sections: a wider gap (more
      // vertical room), slower winding (lower freq), and more spacing
      // between obstacle pairs (more reaction time).
      flyZones: [{ start: 16095, end: 18695, spacing: 220, gapSize: 170, freq: 0.45 }],
      speedPortals: { interval: 1400, pattern: [1.2, 0.85] } }
  ];

  function bestProgressKey(id) { return 'gd_clone_progress_' + id; }
  function bestTimeKey(id) { return 'gd_clone_time_' + id; }

  function getBestProgress(id) {
    try { return parseInt(localStorage.getItem(bestProgressKey(id)) || '0', 10) || 0; }
    catch (e) { return 0; }
  }
  function getBestTime(id) {
    try {
      const v = localStorage.getItem(bestTimeKey(id));
      return v ? parseFloat(v) : null;
    } catch (e) { return null; }
  }
  function setBestProgress(id, pct) {
    try { localStorage.setItem(bestProgressKey(id), String(pct)); } catch (e) {}
  }
  function setBestTime(id, seconds) {
    try { localStorage.setItem(bestTimeKey(id), String(seconds)); } catch (e) {}
  }

  // ---- audio ----
  // Everything here is synthesized with the Web Audio API - no external
  // sound files - so the game stays a single self-contained HTML file.
  // AudioContext is created lazily and only ever (re)started from inside a
  // real user gesture handler (jump()/startLevel()), which satisfies every
  // browser's autoplay-must-follow-a-gesture rule.
  let audioCtx = null;
  let masterGain = null;
  let muted = false;
  try { muted = localStorage.getItem('gd_clone_muted') === '1'; } catch (e) {}

  function ensureAudio() {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      audioCtx = new AC();
      masterGain = audioCtx.createGain();
      masterGain.gain.value = muted ? 0 : 1;
      masterGain.connect(audioCtx.destination);
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  // Short synthesized blip/sweep - the building block for every sound
  // effect. freqEnd (optional) makes the pitch glide over the note, which
  // is what gives the jump/complete sounds their "boing"/"ta-da" character.
  function playTone(freq, offset, duration, opts) {
    const ac = ensureAudio();
    if (!ac || muted) return;
    opts = opts || {};
    const t0 = ac.currentTime + offset;
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    osc.type = opts.type || 'square';
    osc.frequency.setValueAtTime(freq, t0);
    if (opts.freqEnd) osc.frequency.exponentialRampToValueAtTime(Math.max(1, opts.freqEnd), t0 + duration);
    const peak = opts.gain != null ? opts.gain : 0.18;
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(peak, t0 + Math.min(0.015, duration * 0.3));
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
    osc.connect(gain);
    gain.connect(masterGain);
    osc.start(t0);
    osc.stop(t0 + duration + 0.02);
  }

  // A short burst of filtered noise - used for the hit/death sound, since a
  // "crash" reads better as noise than as a clean tone.
  function playNoiseBurst(offset, duration, opts) {
    const ac = ensureAudio();
    if (!ac || muted) return;
    opts = opts || {};
    const t0 = ac.currentTime + offset;
    const bufferSize = Math.ceil(ac.sampleRate * duration);
    const buffer = ac.createBuffer(1, bufferSize, ac.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
    const noise = ac.createBufferSource();
    noise.buffer = buffer;
    const filter = ac.createBiquadFilter();
    filter.type = opts.filterType || 'lowpass';
    filter.frequency.setValueAtTime(opts.filterFreq || 1200, t0);
    if (opts.filterEnd) filter.frequency.exponentialRampToValueAtTime(opts.filterEnd, t0 + duration);
    const gain = ac.createGain();
    const peak = opts.gain != null ? opts.gain : 0.25;
    gain.gain.setValueAtTime(peak, t0);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
    noise.connect(filter);
    filter.connect(gain);
    gain.connect(masterGain);
    noise.start(t0);
    noise.stop(t0 + duration + 0.02);
  }

  function playJumpSound() {
    playTone(340, 0, 0.13, { type: 'square', freqEnd: 620, gain: 0.14 });
  }

  function playHitSound() {
    // A harsh descending tone layered with a noise crash - reads as an
    // unambiguous "you messed up" cue, distinct from the jump blip.
    playTone(180, 0, 0.28, { type: 'sawtooth', freqEnd: 40, gain: 0.22 });
    playNoiseBurst(0, 0.22, { filterFreq: 2600, filterEnd: 200, gain: 0.3 });
  }

  function playCompleteSound() {
    const notes = [523.25, 659.25, 783.99, 1046.5]; // C5 E5 G5 C6
    notes.forEach(function(f, i) { playTone(f, i * 0.09, 0.22, { type: 'square', gain: 0.16 }); });
  }

  // Background music: a small looping chiptune pattern, scheduled a little
  // ahead of playback time (the standard Web Audio "lookahead" trick) so it
  // stays tight even though the browser only calls our timer roughly, not
  // sample-accurately.
  const MUSIC_TEMPO = 132; // bpm
  const MUSIC_STEP = 60 / MUSIC_TEMPO / 2; // eighth notes
  // A minor, two-bar bassline-plus-arpeggio loop. null = rest.
  const MUSIC_PATTERN = [
    { bass: 110.00, lead: null },
    { bass: null,   lead: 440.00 },
    { bass: 130.81, lead: null },
    { bass: null,   lead: 523.25 },
    { bass: 164.81, lead: null },
    { bass: null,   lead: 659.25 },
    { bass: 130.81, lead: null },
    { bass: null,   lead: 523.25 },
    { bass: 110.00, lead: null },
    { bass: null,   lead: 440.00 },
    { bass: 146.83, lead: null },
    { bass: null,   lead: 587.33 },
    { bass: 164.81, lead: null },
    { bass: null,   lead: 493.88 },
    { bass: 174.61, lead: null },
    { bass: null,   lead: 440.00 }
  ];
  let musicPlaying = false;
  let musicNextTime = 0;
  let musicStep = 0;
  let musicTimerId = null;

  function scheduleMusic() {
    const ac = ensureAudio();
    if (!ac || !musicPlaying) return;
    while (musicNextTime < ac.currentTime + 0.15) {
      const step = MUSIC_PATTERN[musicStep % MUSIC_PATTERN.length];
      const offset = musicNextTime - ac.currentTime;
      if (step.bass) playTone(step.bass, offset, MUSIC_STEP * 0.95, { type: 'triangle', gain: 0.09 });
      if (step.lead) playTone(step.lead, offset, MUSIC_STEP * 0.85, { type: 'square', gain: 0.05 });
      musicNextTime += MUSIC_STEP;
      musicStep++;
    }
    musicTimerId = setTimeout(scheduleMusic, 40);
  }

  function startMusic() {
    if (muted) return;
    const ac = ensureAudio();
    if (!ac || musicPlaying) return;
    musicPlaying = true;
    musicNextTime = ac.currentTime + 0.05;
    musicStep = 0;
    scheduleMusic();
  }

  function stopMusic() {
    musicPlaying = false;
    if (musicTimerId) { clearTimeout(musicTimerId); musicTimerId = null; }
  }

  function updateMuteBtn() {
    if (muteBtn) muteBtn.textContent = muted ? '\u{1F507}' : '\u{1F50A}';
  }

  function toggleMute() {
    muted = !muted;
    try { localStorage.setItem('gd_clone_muted', muted ? '1' : '0'); } catch (e) {}
    updateMuteBtn();
    if (masterGain) masterGain.gain.value = muted ? 0 : 1;
    if (muted) stopMusic();
    else if (state === 'playing') startMusic();
  }
  updateMuteBtn();

  // ---- state ----
  let state = 'menu'; // 'menu' | 'ready' | 'playing' | 'dead' | 'complete'
  let isHolding = false; // continuous hold state, used for thrust in flying sections
  let currentLevelIndex = 0;
  let level, levelData, player, speed, distanceTraveled, frame, rotation;
  let particles = [];
